<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Login | MyFitnesJourney</title>
</head>

<body>
  <div class="flex h-screen">
    <!-- Left Column -->
    <div class="hidden lg:block relative basis-2/4">
      <img class="absolute z-0 h-full object-cover"
        src="{{url_for('static', filename='images/bb-romanian-deadlift.jpg')}}" alt="Barbell Romanian Deadlift">
      <div class="absolute z-10 flex flex-col justify-center items-start h-full w-full pl-10 inset-0 bg-black/50">
        <h2 class="text-4xl md:text-5xl font-bold text-white mb-4 drop-shadow-lg">
          Push Your Limits.
        </h2>
        <p class="text-lg text-gray-200 max-w-md">
          Every small step adds up. Stay consistent, show up, and watch your journey transform.
        </p>
      </div>
    </div>

    <!-- Right Column -->
    <div class="flex flex-col justify-between grow basis-1/2 p-6">
      <a href="/" class="flex items-center gap-2 lg:gap-3 w-fit">
        <span class="w-7 h-7 lg:w-9 lg:h-9 bg-black rounded-lg flex items-center justify-center">
          <img class="w-4 h-4 lg:w-5 lg:h-5" alt="MyFitnessJourney Logo"
            src="{{url_for('static', filename='images/logo.svg')}}" />
        </span>
        <p class="lg:text-xl font-semibold">MyFitnessJourney</p>
      </a>

      <div class="flex flex-col items-center justify-center flex-1 gap-8">
        <div class="w-full max-w-md">
          <div class="text-center mt-0 mb-8">
            <h2 class="text-3xl lg:text-4xl font-bold text-black mb-2">Welcome Back</h2>
            <p class="lg:text-lg text-gray-600">Sign in to continue your fitness journey</p>
          </div>

          <form class="flex flex-col gap-6">
            <div>
              <label for="username" class="block text-sm lg:text-base font-semibold text-gray-600 mb-1">
                Username
              </label>
              <input type="text" id="username" name="username" required
                class="text-sm w-full py-1 border-b bg-transparent border-gray-400 focus:outline-none focus:border-black transition-colors" />
            </div>

            <div>
              <label for="password" class="block text-sm lg:text-base font-semibold text-gray-600 mb-1">
                Password
              </label>
              <input type="password" id="password" name="password" required
                class="text-sm w-full py-1 border-b bg-transparent border-gray-400 focus:outline-none focus:border-black transition-colors" />
            </div>

            <div class="flex items-center justify-between text-sm">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-black focus:ring-black" />
                <span class="text-gray-700">Remember me</span>
              </label>

              <a href="/forgot-password" class="text-gray-600 hover:text-black transition-colors">
                Forgot password?
              </a>
            </div>

            <button type="submit"
              class="w-full py-3 bg-black text-white font-medium rounded-lg hover:bg-gray-800 transition duration-200">
              Login
            </button>
          </form>

          <div class="mt-8 text-center">
            <p class="text-gray-600">
              Don't have an account?
              <a href="/register" class="text-black font-semibold hover:underline">Create Account</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
