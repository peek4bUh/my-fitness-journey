<!-- Updated sidebar to support collapsed state and hide title on mobile -->
<aside x-data="{ sidebarOpen: window.innerWidth >= 1024 }"
  @resize.window="if (window.innerWidth >= 1024) sidebarOpen = true"
  :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
  class="fixed left-0 top-0 z-50 flex h-screen px-4 flex-col border-r border-gray-200 bg-white transition-all duration-300 lg:static lg:translate-x-0"
  :style="sidebarCollapsed && window.innerWidth >= 1024 ? 'width: 4.5rem' : 'width: 300px'">

  <!-- SIDEBAR HEADER -->
  <div class="hidden lg:flex items-center border-b border-gray-200 h-16">
    <div class="flex items-center gap-3 overflow-hidden">
      <div class="w-8 h-8 bg-gray-900 rounded-lg flex items-center justify-center flex-shrink-0">
        <img class="w-5 h-5" alt="MyFitnessJourney Logo" src="{{ url_for('static', filename='images/logo.svg') }}" />
      </div>
      <h1 x-show="!sidebarCollapsed" class="text-lg font-semibold text-gray-900 whitespace-nowrap">MyFitnessJourney</h1>
    </div>
  </div>

  <!-- Mobile header with just logo -->
  <div class="flex lg:hidden items-center justify-center px-6 py-6 border-b border-gray-100 h-16">
    <div class="w-8 h-8 bg-gray-900 rounded-lg flex items-center justify-center">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    </div>
  </div>

  <!-- SIDEBAR MENU -->
  <nav class="flex-1 overflow-y-auto py-6">
    <ul class="flex flex-col gap-1">
      <!-- Overview -->
      <li>
        <a href="#"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-900 bg-gray-100 transition-colors"
          :class="sidebarCollapsed ? 'justify-center' : ''">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          <span x-show="!sidebarCollapsed" class="lg:block">Overview</span>
        </a>
      </li>

      <!-- Workouts -->
      <li>
        <a href="#"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
          :class="sidebarCollapsed ? 'justify-center' : ''">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
          </svg>
          <span x-show="!sidebarCollapsed" class="lg:block">Workouts</span>
        </a>
      </li>

      <!-- Programs -->
      <li>
        <a href="#"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
          :class="sidebarCollapsed ? 'justify-center' : ''">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          <span x-show="!sidebarCollapsed" class="lg:block">Programs</span>
        </a>
      </li>

      <!-- Body Weights -->
      <li>
        <a href="#"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
          :class="sidebarCollapsed ? 'justify-center' : ''">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
          <span x-show="!sidebarCollapsed" class="lg:block">Body Weights</span>
        </a>
      </li>
    </ul>

    <!-- Divider -->
    <div x-show="!sidebarCollapsed" class="my-6 border-t border-gray-200"></div>
    <div x-show="sidebarCollapsed" class="my-6 mx-auto w-8 border-t border-gray-200"></div>

    <!-- Source Code -->
    <ul class="flex flex-col gap-1">
      <li>
        <a href="#"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
          :class="sidebarCollapsed ? 'justify-center' : ''">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span x-show="!sidebarCollapsed" class="lg:block">Source Code</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>

<!-- Overlay for mobile -->
<div x-show="sidebarOpen" @click="sidebarOpen = false" class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"
  x-transition:enter="transition-opacity ease-linear duration-300" x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100" x-transition:leave="transition-opacity ease-linear duration-300"
  x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"></div>
