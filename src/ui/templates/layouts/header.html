<header class="sticky top-0 z-30 flex h-16 items-center gap-4 border-b border-gray-200 bg-white px-4 lg:px-6">

    <!-- Left: Sidebar Toggle -->
    <button @click="sidebarCollapsed = !sidebarCollapsed"
        class="hidden lg:flex items-center justify-center w-10 h-10 rounded-lg border border-gray-200 cursor-pointer">
        <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
    </button>

    <!-- Mobile: Hamburger -->
    <button @click="sidebarOpen = !sidebarOpen"
        class="lg:hidden flex items-center justify-center w-10 h-10 rounded-lg hover:bg-gray-100 transition-colors">
        <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
    </button>

    <!-- Center: App Title (Mobile Only) -->
    <div class="flex-1 lg:hidden flex items-center justify-center">
        <h1 class="text-lg font-semibold text-gray-900">MyFitnessJourney</h1>
    </div>

    <!-- Spacer for desktop -->
    <div class="hidden lg:flex flex-1"></div>

    <!-- Right: User Menu -->
    <div class="relative" x-data="{ userMenuOpen: false }" @click.away="userMenuOpen = false">
        <button @click="userMenuOpen = !userMenuOpen"
            class="flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-gray-50 transition-colors cursor-pointer">
            <div class="flex-shrink-0 w-9 h-9 bg-gray-200 rounded-full flex items-center justify-center">
                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </div>
            <div class="flex gap-3">
                <div class="hidden md:block">
                    <p class="text-sm text-left font-semibold">{{ username }}</p>
                    <p class="text-xs text-muted-foreground">john.doe@example.com</p>
                </div>
            </div>
        </button>

        <!-- User Dropdown Menu -->
        <div x-show="userMenuOpen" x-transition:enter="transition ease-out duration-100"
            x-transition:enter-start="transform opacity-0 scale-95"
            x-transition:enter-end="transform opacity-100 scale-100" x-transition:leave="transition ease-in duration-75"
            x-transition:leave-start="transform opacity-100 scale-100"
            x-transition:leave-end="transform opacity-0 scale-95"
            class="absolute right-0 mt-2 w-56 origin-top-right rounded-lg bg-white border border-gray-200 shadow-lg"
            style="display: none;">

            <!-- User Info (Mobile) -->
            <div class="lg:hidden px-4 py-3 border-b border-gray-100">
                <p class="text-sm font-medium text-gray-900">{{ username }}</p>
                <p class="text-xs text-gray-600 mt-0.5">{{ email }}</p>
            </div>

            <!-- Menu Items -->
            <div class="py-1">
                <a href="#"
                    class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span>Account Settings</span>
                </a>
                <a href="#"
                    class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                    <span>Edit Profile</span>
                </a>
            </div>

            <!-- Logout -->
            <div class="border-t border-gray-100 py-1">
                <a href="{{ url_for('ui.auth.logout') }}"
                    class="flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    <span>Logout</span>
                </a>
            </div>
        </div>
    </div>
</header>
