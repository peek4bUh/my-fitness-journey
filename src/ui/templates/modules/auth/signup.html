{% extends "layouts/auth.html" %}
{% block title %}Signup{% endblock %}

{% block content %}
<div class="text-center mt-0 mb-8">
  <h2 class="text-3xl lg:text-4xl font-bold text-black mb-2">Create Account</h2>
  <p class="lg:text-lg text-gray-600">Start your fitness journey today</p>
</div>

<form method="post" class="flex flex-col gap-6">
  <div>
    <label for="username" class="block text-sm lg:text-base font-semibold text-gray-600 mb-1">
      Username
    </label>
    <input type="text" id="username" name="username" required
      class="text-sm lg:text-base w-full py-1 border-b bg-transparent border-gray-400 focus:outline-none focus:border-black transition-colors" />
  </div>

  <div>
    <label for="email" class="block text-sm lg:text-base font-semibold text-gray-600 mb-1">
      Email
    </label>
    <input type="text" id="email" name="email" required
      class="text-sm lg:text-base w-full py-1 border-b bg-transparent border-gray-400 focus:outline-none focus:border-black transition-colors" />
  </div>

  <div>
    <label for="password" class="block text-sm lg:text-base font-semibold text-gray-600 mb-1">
      Password
    </label>
    <input type="password" id="password" name="password" required
      class="text-sm lg:text-base w-full py-1 border-b bg-transparent border-gray-400 focus:outline-none focus:border-black transition-colors" />
  </div>

  <div>
    <label for="confirm-password" class="block text-sm lg:text-base font-semibold text-gray-600 mb-1">
      Confirm Password
    </label>
    <input type="password" id="confirm-password" name="confirm-password" required
      class="text-sm lg:text-base w-full py-1 border-b bg-transparent border-gray-400 focus:outline-none focus:border-black transition-colors" />
  </div>

  <button type="submit"
    class="w-full py-3 bg-black text-white font-semibold rounded-lg hover:bg-gray-800 transition duration-200">
    Create Account
  </button>
</form>

<div class="mt-8 text-center">
  <p class="text-gray-600">
    Already registered?
    <a href="/login" class="text-black font-semibold hover:underline">Login</a>
  </p>
</div>

</div>
{% endblock %}
