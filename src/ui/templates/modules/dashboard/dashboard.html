<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | MyFitnessJourney</title>
  <link href="{{url_for('static', filename='css/main.css')}}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>

<body class="bg-gray-50" x-data="{ sidebarOpen: false, sidebarCollapsed: false }">

  <!-- Page Wrapper -->
  <div class="flex h-screen overflow-hidden">
    {% include './layouts/sidebar.html' %}

    <!-- Content Area -->
    <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">

      <!-- Added header component -->
      {% include './layouts/header.html' %}

      <!-- Main Content -->
      <main class="p-4 md:p-6 lg:p-8">

        <!-- Responsive Bento Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 auto-rows-fr">

          <!-- Large Card A -->
          <div
            class="md:col-span-2 md:row-span-2 border border-gray-200 rounded-xl bg-white p-6 flex items-center justify-center">
            <div class="text-center">
              <h3 class="text-lg font-semibold text-gray-900 mb-2">Main Stats</h3>
              <p class="text-gray-600">Your primary metrics</p>
            </div>
          </div>

          <!-- Card B -->
          <div class="md:col-span-2 border border-gray-200 rounded-xl bg-white p-6 flex items-center justify-center">
            <div class="text-center">
              <h3 class="text-lg font-semibold text-gray-900 mb-2">Recent Activity</h3>
              <p class="text-gray-600">Latest updates</p>
            </div>
          </div>

          <!-- Card C -->
          <div class="border border-gray-200 rounded-xl bg-white p-6 flex items-center justify-center">
            <div class="text-center">
              <h3 class="text-lg font-semibold text-gray-900 mb-2">Workouts</h3>
              <p class="text-gray-600">12</p>
            </div>
          </div>

          <!-- Card D -->
          <div class="md:row-span-2 border border-gray-200 rounded-xl bg-white p-6 flex items-center justify-center">
            <div class="text-center">
              <h3 class="text-lg font-semibold text-gray-900 mb-2">Progress</h3>
              <p class="text-gray-600">Track your gains</p>
            </div>
          </div>

          <!-- Card E -->
          <div class="md:row-span-2 border border-gray-200 rounded-xl bg-white p-6 flex items-center justify-center">
            <div class="text-center">
              <h3 class="text-lg font-semibold text-gray-900 mb-2">Goals</h3>
              <p class="text-gray-600">Set targets</p>
            </div>
          </div>

          <!-- Card F -->
          <div class="border border-gray-200 rounded-xl bg-white p-6 flex items-center justify-center">
            <div class="text-center">
              <h3 class="text-lg font-semibold text-gray-900 mb-2">Weight</h3>
              <p class="text-gray-600">75kg</p>
            </div>
          </div>

          <!-- Card G -->
          <div class="border border-gray-200 rounded-xl bg-white p-6 flex items-center justify-center">
            <div class="text-center">
              <h3 class="text-lg font-semibold text-gray-900 mb-2">Calories</h3>
              <p class="text-gray-600">2,400</p>
            </div>
          </div>

          <!-- Card H -->
          <div class="md:col-span-2 border border-gray-200 rounded-xl bg-white p-6 flex items-center justify-center">
            <div class="text-center">
              <h3 class="text-lg font-semibold text-gray-900 mb-2">Weekly Summary</h3>
              <p class="text-gray-600">Your week at a glance</p>
            </div>
          </div>

          <!-- Card I -->
          <div class="border border-gray-200 rounded-xl bg-white p-6 flex items-center justify-center">
            <div class="text-center">
              <h3 class="text-lg font-semibold text-gray-900 mb-2">Streak</h3>
              <p class="text-gray-600">7 days</p>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

</body>

</html>
