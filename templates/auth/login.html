<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MyFitnessJourney</title>
    <link href="{{url_for('static', filename='css/main.css')}}" rel="stylesheet">
</head>

<body>
    <div class="bg-yellow-400 h-screen overflow-hidden flex items-center justify-center">
        <div class="bg-white lg:w-6/12 md:7/12 w-8/12 shadow-3xl rounded-xl">
            <div class="bg-gray-800 shadow shadow-gray-200 absolute left-1/2 transform -translate-x-1/2 -translate-y-1/2 rounded-full p-2 md:p-6"
                __v0_r="0,3121,3188">
                <img class="w-10 h-10" alt="MyFitnessJourney Logo"
                    src="{{url_for('static', filename='images/logo.svg')}}" />
            </div>
            <form class="p-12 md:p-24">
                <div class="flex items-center text-lg mb-6 md:mb-8">
                    <svg class="absolute ml-3" width="24" viewBox="0 0 24 24">
                        <path
                            d="M20.822 18.096c-3.439-.794-6.64-1.49-5.09-4.418 4.72-8.912 1.251-13.678-3.732-13.678-5.082 0-8.464 4.949-3.732 13.678 1.597 2.945-1.725 3.641-5.09 4.418-3.073.71-3.188 2.236-3.178 4.904l.004 1h23.99l.004-.969c.012-2.688-.092-4.222-3.176-4.935z" />
                    </svg>
                    <input type="text" id="username"
                        class="bg-gray-200 rounded pl-12 py-2 md:py-4 focus:outline-none w-full"
                        placeholder="Username" />
                </div>
                <div class="flex items-center text-lg mb-6 md:mb-8">
                    <svg class="absolute ml-3" viewBox="0 0 24 24" width="24">
                        <path
                            d="m18.75 9h-.75v-3c0-3.309-2.691-6-6-6s-6 2.691-6 6v3h-.75c-1.24 0-2.25 1.009-2.25 2.25v10.5c0 1.241 1.01 2.25 2.25 2.25h13.5c1.24 0 2.25-1.009 2.25-2.25v-10.5c0-1.241-1.01-2.25-2.25-2.25zm-10.75-3c0-2.206 1.794-4 4-4s4 1.794 4 4v3h-8zm5 10.722v2.278c0 .552-.447 1-1 1s-1-.448-1-1v-2.278c-.595-.347-1-.985-1-1.722 0-1.103.897-2 2-2s2 .897 2 2c0 .737-.405 1.375-1 1.722z" />
                    </svg>
                    <input type="password" id="password"
                        class="bg-gray-200 rounded pl-12 py-2 md:py-4 focus:outline-none w-full"
                        placeholder="Password" />
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember_me" name="remember_me" type="checkbox"
                            class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 disabled:cursor-wait disabled:opacity-50">
                        <label for="remember_me" class="ml-2 block text-base text-gray-900">Remember me</label>
                    </div>
                    <div class="text-sm">
                        <a class="font-medium text-base text-indigo-400 hover:text-indigo-500" href="">
                            Forgot your password?
                        </a>
                    </div>
                </div>
                <button
                    class="mt-4 bg-gradient-to-b from-gray-700 to-gray-900 font-medium p-2 md:p-4 text-white uppercase w-full rounded cursor-pointer">Login</button>
            </form>
            <div class="m-auto mb-8 w-fit md:mt-8">
                <span class="m-auto text-base">Don't have an account?
                    <a class="font-semibold text-indigo-600" href="/register">Create Account</a>
                </span>
            </div>
        </div>
    </div>
</body>

</html>
