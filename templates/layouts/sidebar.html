<aside x-data="{ openMenu: '', sidebarOpen: true }" :class="sidebarOpen ? 'w-[290px]' : 'w-[80px]'"
  class="sidebar fixed left-0 top-0 z-9999 flex h-screen pb-6 flex-col overflow-y-hidden border-r border-gray-200 bg-white px-5 duration-300 ease-linear lg:static lg:translate-x-0">

  <!-- SIDEBAR HEADER -->
  <div class="sidebar-header flex items-center justify-between pb-7 pt-8">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-gray-800 rounded-lg flex items-center justify-center">
        <img class="w-5 h-5" alt="MyFitnessJourney Logo" src="{{ url_for('static', filename='images/logo.svg') }}" />
      </div>
      <!-- App name hidden when collapsed -->
      <h1 x-show="sidebarOpen" x-transition class="text-xl font-bold text-gray-900 whitespace-nowrap">
        MyFitnessJourney
      </h1>
    </div>

    <!-- Toggle button -->
    <button @click="sidebarOpen = !sidebarOpen"
      class="text-gray-500 hover:text-gray-700 p-2 rounded-lg hover:bg-gray-100 transition">
      <svg x-show="sidebarOpen" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
        stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
      <svg x-show="!sidebarOpen" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
        stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  <!-- SIDEBAR MENU -->
  <div class="no-scrollbar flex flex-col grow overflow-y-auto duration-300 ease-linear">
    <nav>

      <!-- MENU SECTION -->
      <div>
        <h3 x-show="sidebarOpen" class="mb-4 text-xs uppercase leading-[20px] text-gray-400" x-transition>MENU</h3>

        <ul class="mb-6 flex flex-col gap-2">
          <!-- Overview -->
          <li>
            <a href="#"
              class="relative flex items-center gap-3 rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100 text-sm font-bold">
              <img alt="Dashboard Icon" src="{{ url_for('static', filename='images/icons/dashboard.svg') }}" />
              <span x-show="sidebarOpen" x-transition>Overview</span>
            </a>
          </li>

          <!-- Lifting (Dropdown) -->
          <li>
            <button @click="openMenu = (openMenu === 'workouts' ? '' : 'workouts')"
              class="w-full flex items-center justify-between gap-3 rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100 text-sm font-bold cursor-pointer">
              <div class="flex items-center gap-3">
                <img alt="Workouts Icon" src="{{ url_for('static', filename='images/icons/workouts.svg') }}" />
                <span x-show="sidebarOpen" x-transition>Lifting</span>
              </div>
              <svg x-show="sidebarOpen" :class="openMenu === 'workouts' ? 'rotate-180' : ''"
                class="w-4 h-4 text-gray-500 transition-transform duration-200" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <!-- Dropdown submenu -->
            <div x-show="openMenu === 'workouts' && sidebarOpen" x-transition class="pl-11 mt-1 flex flex-col gap-1">
              <a href="#" class="block rounded-md px-3 py-2 text-sm text-gray-600 hover:bg-gray-100">All Workouts</a>
              <a href="#" class="block rounded-md px-3 py-2 text-sm text-gray-600 hover:bg-gray-100">Create Workout</a>
              <a href="#" class="block rounded-md px-3 py-2 text-sm text-gray-600 hover:bg-gray-100">Workout History</a>
            </div>
          </li>

          <!-- Programs -->
          <li>
            <a href="#"
              class="relative flex items-center gap-3 rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100 text-sm font-bold">
              <img alt="Body Weights Icon" src="{{ url_for('static', filename='images/icons/body-weights.svg') }}" />
              <span x-show="sidebarOpen" x-transition>Programs</span>
            </a>
          </li>

          <!-- Body Weights -->
          <li>
            <a href="#"
              class="relative flex items-center gap-3 rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100 text-sm font-bold">
              <img alt="Body Weights Icon" src="{{ url_for('static', filename='images/icons/body-weights.svg') }}" />
              <span x-show="sidebarOpen" x-transition>Body Weights</span>
            </a>
          </li>
        </ul>
      </div>

      <!-- USER SECTION -->
      <div>
        <h3 x-show="sidebarOpen" class="mb-4 text-xs uppercase leading-[20px] text-gray-400" x-transition>USER</h3>

        <ul class="mb-6 flex flex-col gap-2">
          <li>
            <a href="#"
              class="relative flex items-center gap-3 rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100 text-sm font-bold">
              <img alt="User Icon" src="{{ url_for('static', filename='images/icons/user.svg') }}" />
              <span x-show="sidebarOpen" x-transition>Profile</span>
            </a>
          </li>
          <li>
            <a href="#"
              class="relative flex items-center gap-3 rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100 text-sm font-bold">
              <img alt="Preferences Icon" src="{{ url_for('static', filename='images/icons/preferences.svg') }}" />
              <span x-show="sidebarOpen" x-transition>Preferences</span>
            </a>
          </li>
          <li>
            <a href="{{ url_for('web.auth.logout_user') }}"
              class="relative flex items-center gap-3 rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100 text-sm font-bold">
              <img alt="Logout Icon" src="{{ url_for('static', filename='images/icons/logout.svg') }}" />
              <span x-show="sidebarOpen" x-transition>Logout</span>
            </a>
          </li>
        </ul>
      </div>

      <!-- OTHER SECTION -->
      <div>
        <h3 x-show="sidebarOpen" class="mb-4 text-xs uppercase leading-[20px] text-gray-400" x-transition>OTHER</h3>

        <ul class="mb-6 flex flex-col gap-2">
          <li>
            <a href="https://github.com/peek4bUh/my-fitness-journey"
              class="relative flex items-center gap-3 rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100 text-sm font-bold">
              <img alt="Code Icon" src="{{ url_for('static', filename='images/icons/code.svg') }}" />
              <span x-show="sidebarOpen" x-transition>Source Code</span>
            </a>
          </li>
          <li>
            <a href="#"
              class="relative flex items-center gap-3 rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100 text-sm font-bold">
              <img alt="Info Icon" src="{{ url_for('static', filename='images/icons/info.svg') }}" />
              <span x-show="sidebarOpen" x-transition>License</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>
  </div>

  <!-- USER FOOTER -->
  <div class="bg-gray-100 rounded-lg px-4 py-3 mt-auto flex items-center gap-3"
    :class="sidebarOpen ? 'justify-start' : 'justify-center'">
    <div class="flex-shrink-0 w-8 h-8 bg-gray-300 rounded-full"></div>
    <div x-show="sidebarOpen" x-transition>
      <span class="text-sm block text-gray-700 font-bold">{{ user }}</span>
    </div>
  </div>
</aside>
